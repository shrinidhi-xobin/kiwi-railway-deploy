daemon on;
worker_processes auto;
error_log /dev/stderr;
pid /tmp/nginx.pid;
include /usr/share/nginx/modules/*.conf;
events {
    worker_connections 1024;
}
http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    gzip on;
    gzip_disable "msie6";
    client_max_body_size 10m;
    large_client_header_buffers 4 10k;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    map $request_uri $limit_key {
        default "";
        ~^/accounts/ $binary_remote_addr;
    }
    limit_req_zone $limit_key zone=ten-per-sec:10m rate=10r/s;
    limit_req_status 429;
    upstream kiwitcms {
        server unix:///tmp/kiwitcms.sock;
    }
    add_header Content-Security-Policy "script-src 'self' cdn.crowdin.com *.ethicalads.io plausible.io;";
    # Cloud Run terminates TLS and forwards HTTP to the container on PORT 8080.
    # Keep one plain listener to avoid certificate and HTTPS redirect loops.
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        location = /favicon.ico {
            alias /Kiwi/static/images/favicon.ico;
        }
        location = /robots.txt {
            alias /Kiwi/static/robots.txt;
        }
        location /uploads/ {
            types { }
            default_type text/plain;
            alias /Kiwi/uploads/;
        }
        location /static/ {
            alias /Kiwi/static/;
        }
        location / {
            include /etc/nginx/uwsgi_params;
            # Cloud Run supplies X-Forwarded-Proto from the original request.
            uwsgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            uwsgi_pass kiwitcms;
            limit_req zone=ten-per-sec burst=20 nodelay;
        }
    }
}
