apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: kiwi
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/cloudsql-instances: "interact-202104:asia-south1:staging-user"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/kiwi:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kiwi-django-secret
                  key: latest
            - name: SUPPORT_GOOGLE_OAUTH_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: api-service-creds
                  key: latest
            - name: ALLOWED_HOSTS
              value: "kiwi-809583518692.us-central1.run.app"
            - name: CSRF_TRUSTED_ORIGINS
              value: "https://kiwi-809583518692.us-central1.run.app"
            - name: DB_HOST
              value: "/cloudsql/interact-202104:asia-south1:staging-user"
            - name: DB_NAME
              value: "kiwi_new_db"
            - name: DB_USER
              value: "kiwi_app_user"
            - name: DB_PORT
              value: "3306"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kiwi-db-pass
                  key: latest
